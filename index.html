<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/styleLogin.css" />

    <link
      rel="icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTm1Xb7btbNV33nmxv08I1X4u9QTDNIKwrMyw&s"
      type="image/x-icon"
    />
  </head>

  <body class="flex items-center justify-center min-h-screen">
    <div class="image">
      <video id="video-bg" autoplay muted loop class="video-bg" playsinline>
        <source
          src="https://improov.com.br/flow/ImproovWeb/assets/11%20MSA_SQU_Psicina.mp4"
          type="video/mp4"
        />
        Seu navegador não suporta a tag de vídeo.
      </video>
    </div>
    <div class="container p-8 rounded-2xl">
      <div class="flex flex-col items-center gap-3 mb-6">
        <img src="gif/assinatura_preto.gif" alt="Logo" class="w-28 h-auto" />
        <div class="text-center">
          <h1 class="login-title">Bem-vindo de volta</h1>
          <p class="login-subtitle">Acesse sua conta com segurança</p>
        </div>
      </div>

      <form
        action="login.php"
        method="post"
        class="space-y-5"
        autocomplete="on"
      >
        <div class="field">
          <input type="text" id="login" name="login" required placeholder=" " />
          <label for="login">Login</label>
          <span class="field-error">Esse campo é obrigatório</span>
        </div>

        <div class="field">
          <input
            type="password"
            id="senha"
            name="senha"
            required
            placeholder=" "
            autocomplete="new-password"
            autocapitalize="off"
            spellcheck="false"
          />
          <label for="senha">Senha</label>
          <button
            type="button"
            class="toggle-password"
            aria-label="Mostrar senha"
            data-target="senha"
          >
            <i class="fa-regular fa-eye" aria-hidden="true"></i>
            <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
          </button>
          <span class="field-error">Esse campo é obrigatório</span>
        </div>

        <div>
          <button type="submit" class="login-btn">Entrar</button>
        </div>
      </form>

      <div class="login-footer mt-6">Precisa de ajuda? Fale com o suporte.</div>
    </div>

    <!-- CDN do Toastify JS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="./script/scriptLogin.js"></script>
    <script>
      const toggleBtn = document.querySelector(".toggle-password");
      const senhaInput = document.getElementById("senha");

      if (toggleBtn && senhaInput) {
        toggleBtn.addEventListener("click", () => {
          const wasPassword = senhaInput.type === "password";
          // toggle the input type
          senhaInput.type = wasPassword ? "text" : "password";
          const nowVisible = senhaInput.type === "text";
          // set class according to visibility (open eye when visible)
          toggleBtn.classList.toggle("is-visible", nowVisible);
          toggleBtn.setAttribute(
            "aria-label",
            nowVisible ? "Ocultar senha" : "Mostrar senha",
          );
        });
      }
    </script>
  </body>
</html>
