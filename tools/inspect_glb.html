<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Inspetor local de GLB</title>
    <style>
      :root {
        font:
          16px/1.5 system-ui,
          sans-serif;
        color-scheme: light dark;
      }
      body {
        max-width: 1000px;
        margin: 32px auto;
        padding: 0 20px;
      }
      h1 {
        font-size: 1.5rem;
      }
      .notice {
        color: #667085;
      }
      .picker {
        display: block;
        margin: 22px 0;
        padding: 16px;
        border: 1px solid #8886;
        border-radius: 10px;
      }
      .summary {
        margin: 14px 0;
        font-weight: 600;
      }
      .tree {
        padding: 14px;
        overflow: auto;
        border: 1px solid #8886;
        border-radius: 10px;
      }
      .tree ul {
        padding-left: 24px;
        list-style: none;
      }
      .tree > ul {
        padding-left: 0;
      }
      .tree li {
        margin: 5px 0;
      }
      .node {
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
      .match {
        color: #18864b;
      }
      .miss {
        color: #a15c00;
      }
      .error {
        color: #c03535;
        font-weight: 600;
      }
      .empty {
        color: #667085;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Inspetor local de GLB</h1>
    <p>
      Escolha o mesmo arquivo GLB que você tentou enviar. A leitura acontece
      neste navegador; o arquivo não é enviado.
    </p>
    <label class="picker"
      >Arquivo GLB <input id="file" type="file" accept=".glb,model/gltf-binary"
    /></label>
    <p id="status" class="notice" role="status">Aguardando um arquivo.</p>
    <p id="summary" class="summary" hidden></p>
    <section
      id="result"
      class="tree"
      aria-label="Hierarquia da cena GLB"
      hidden
    ></section>
    <script>
      const fileInput = document.getElementById("file");
      const status = document.getElementById("status");
      const summary = document.getElementById("summary");
      const result = document.getElementById("result");

      function floorId(name) {
        const value = (name || "").trim();
        const piece = /^(PAV(?:TO)?_.+_[0-9]+)_([0-9]+)$/i.exec(value);
        if (piece) return piece[1].toUpperCase();
        if (/^PAV(?:TO)?_.+_[0-9]{1,3}$/i.test(value))
          return value.toUpperCase();
        return null;
      }

      function nodeLabel(node, index, meshes) {
        const name =
          typeof node.name === "string" && node.name.trim()
            ? node.name.trim()
            : `(sem nome · nó ${index})`;
        const mesh = Number.isInteger(node.mesh) ? meshes[node.mesh] : null;
        const meshName =
          typeof mesh?.name === "string" && mesh.name.trim()
            ? mesh.name.trim()
            : null;
        const identifiers = [floorId(name), floorId(meshName)].filter(Boolean);
        const directGroup = [name, meshName].find(
          (value) => value && /^PAV(?:TO)?_.+_[0-9]{1,3}$/i.test(value.trim()),
        );
        const classification = identifiers.length
          ? `Pavimento identificado: ${[...new Set(identifiers)].join(", ")}`
          : directGroup
            ? `Grupo de pavimento: ${directGroup.trim().toUpperCase()}`
            : "Sem nome de pavimento reconhecido";
        return {
          name,
          meshName,
          classification,
          recognized: identifiers.length > 0 || Boolean(directGroup),
        };
      }

      function treeForScene(data) {
        const sceneIndex = Number.isInteger(data.scene) ? data.scene : 0;
        const roots = data.scenes?.[sceneIndex]?.nodes;
        if (!Array.isArray(roots))
          throw new Error("A cena ativa não possui uma lista válida de nós.");
        const nodes = Array.isArray(data.nodes) ? data.nodes : [];
        const meshes = Array.isArray(data.meshes) ? data.meshes : [];
        const seen = new Set();
        let recognized = 0;
        let meshCount = 0;

        function renderNode(index, ancestors = new Set()) {
          const node = nodes[index];
          if (!node || typeof node !== "object")
            return `<li>Nó ${index}: referência inválida</li>`;
          if (ancestors.has(index))
            return `<li>Nó ${index}: ciclo na hierarquia</li>`;
          seen.add(index);
          const info = nodeLabel(node, index, meshes);
          if (info.recognized) recognized++;
          if (Number.isInteger(node.mesh)) meshCount++;
          const classes = info.recognized ? "node match" : "node miss";
          const meshText = info.meshName
            ? `<br>Malha: ${escapeHtml(info.meshName)}`
            : "";
          const children = Array.isArray(node.children) ? node.children : [];
          const nextAncestors = new Set(ancestors).add(index);
          const childList = children.length
            ? `<ul>${children.map((child) => renderNode(child, nextAncestors)).join("")}</ul>`
            : "";
          return `<li><span class="${classes}">${escapeHtml(info.name)}</span>${meshText}<br><span class="${classes}">${escapeHtml(info.classification)}</span>${childList}</li>`;
        }

        const markup = roots.map((index) => renderNode(index)).join("");
        return {
          markup: `<ul>${markup || "<li>Esta cena não tem nós.</li>"}</ul>`,
          nodeCount: seen.size,
          meshCount,
          recognized,
        };
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character],
        );
      }

      async function inspect(file) {
        summary.hidden = true;
        result.hidden = true;
        status.className = "notice";
        status.textContent = `Lendo ${file.name}…`;
        try {
          if (file.size < 20)
            throw new Error(
              "O arquivo está muito pequeno para ser um GLB válido.",
            );
          const header = await file.slice(0, 20).arrayBuffer();
          const view = new DataView(header);
          const magic = new TextDecoder().decode(new Uint8Array(header, 0, 4));
          const version = view.getUint32(4, true);
          const declaredLength = view.getUint32(8, true);
          const jsonLength = view.getUint32(12, true);
          const jsonType = view.getUint32(16, true);
          if (magic !== "glTF" || version !== 2 || jsonType !== 0x4e4f534a)
            throw new Error(
              "Cabeçalho GLB inválido ou versão não suportada (esperado glTF 2.0).",
            );
          if (
            declaredLength !== file.size ||
            20 + jsonLength > file.size ||
            jsonLength > 32 * 1024 * 1024
          )
            throw new Error("Tamanho do GLB ou do bloco JSON inválido.");
          const jsonBytes = await file.slice(20, 20 + jsonLength).arrayBuffer();
          const jsonText = new TextDecoder()
            .decode(jsonBytes)
            .replace(/[\u0000\u0020]+$/g, "");
          const data = JSON.parse(jsonText);
          if (data.asset?.version !== "2.0")
            throw new Error("O arquivo não declara o formato glTF 2.0.");
          const sceneIndex = Number.isInteger(data.scene) ? data.scene : 0;
          const tree = treeForScene(data);
          result.innerHTML = tree.markup;
          result.hidden = false;
          summary.textContent = `${file.name} · cena ativa ${sceneIndex} · ${tree.nodeCount} nós · ${tree.meshCount} malhas · ${tree.recognized} nós com nome de pavimento reconhecido`;
          summary.hidden = false;
          status.textContent =
            "Leitura concluída. Os nomes em verde foram reconhecidos pela regra do Mapa de Pavimento.";
        } catch (error) {
          status.className = "error";
          status.textContent =
            error instanceof SyntaxError
              ? "O JSON interno do GLB está inválido."
              : error.message || "Não foi possível ler este GLB.";
        }
      }

      fileInput.addEventListener("change", () => {
        if (fileInput.files?.[0]) void inspect(fileInput.files[0]);
      });
    </script>
  </body>
</html>
